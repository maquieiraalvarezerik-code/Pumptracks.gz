<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CÓMICO - Pumptracks Galicia</title>
  <style>
    /* Estilos globales */
    body {
      background-color: #33312D; /* Fondo Asfalto */
      color: #FFFFFF;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Cabecera */
    header {
      width: 100%;
      background-color: #252421;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      border-bottom: 1px solid #4A4843;
    }

    .logo {
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    /* Contenido principal */
    main {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #A09E9B;
      margin-bottom: 30px;
    }

    /* Contenedor del Mapa Oscuro */
    .map-container {
      width: 100%;
      height: 550px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #4A4843;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Filtro para modo oscuro en Google Maps */
      filter: invert(90%) hue-rotate(180deg) contrast(120%);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">[ CÓMICO ]</div>
  </header>

  <main>
    <h1>CÓMICO</h1>
    <p class="subtitle">Erode. Mapa interactivo de Pumptracks en Galicia.</p>
    
    <div class="map-container">
      <iframe src="https://www.google.com/maps/d/u/2/embed?mid=1Okz7NtyExwpC5xjpuGbSp9csLINp1ew&ehbc=2E312F" width="640" height="480"></iframe>
      <iframe src="https://www.google.com/maps/d/embed?mid=TU_CODIGO_DE_MAPA"></iframe>
    </div>
  </main>

</body>
</html>
